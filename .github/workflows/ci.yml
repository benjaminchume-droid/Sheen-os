name: Sheen OS CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test/build dependencies
        run: sudo sh ./scripts/install-deps-debian.sh

      - name: Validate architecture
        run: sh ./tools/test-architecture.sh

      - name: Validate API contracts
        run: sh ./tools/test-contracts.sh

      - name: Validate target
        run: sh ./tools/validate-target.sh x86_64-uefi-usb

      - name: Validate kernel contract
        run: sh ./tools/test-kernel.sh x86_64-uefi-usb

      - name: Validate UEFI boot contract
        run: sh ./tools/validate-uefi.sh x86_64-uefi-usb

      - name: Validate initramfs contract
        run: sh ./tools/validate-initramfs.sh x86_64-uefi-usb

      - name: Validate PID 1 contract
        run: sh ./tools/validate-pid1.sh x86_64-uefi-usb

      - name: Validate root filesystem contract
        run: sh ./tools/validate-rootfs.sh x86_64-uefi-usb

      - name: Validate USB image contract
        run: sh ./tools/validate-usb.sh x86_64-uefi-usb

      - name: Validate hardware discovery contract
        run: sh ./tools/validate-hardware-discovery.sh

      - name: Validate device manager contract
        run: sh ./tools/validate-device-manager.sh

      - name: Test device manager
        run: sh ./tools/test-device-manager.sh

      - name: Validate service manager contract
        run: sh ./tools/validate-service-manager.sh

      - name: Test service manager
        run: sh ./tools/test-service-manager.sh

      - name: Validate IPC bus contract
        run: sh ./tools/validate-ipc-bus.sh

      - name: Test IPC bus
        run: sh ./tools/test-ipc-bus.sh

      - name: Validate configuration contract
        run: sh ./tools/validate-config.sh

      - name: Test configuration system
        run: sh ./tools/test-config.sh

      - name: Validate logging contract
        run: sh ./tools/validate-logging.sh

      - name: Test logging and diagnostics
        run: sh ./tools/test-logging.sh

      - name: Validate DRM KMS contract
        run: sh ./tools/validate-drm.sh

      - name: Test DRM KMS probe
        run: sh ./tools/test-drm.sh

      - name: Validate GPU detection contract
        run: sh ./tools/validate-gpu.sh

      - name: Test GPU detection
        run: sh ./tools/test-gpu.sh

      - name: Validate display manager contract
        run: sh ./tools/validate-display-manager.sh

      - name: Test display manager
        run: sh ./tools/test-display-manager.sh

      - name: Validate audio contract
        run: sh ./tools/validate-audio.sh

      - name: Test audio device probe
        run: sh ./tools/test-audio.sh

      - name: Validate input engine contract
        run: sh ./tools/validate-input.sh

      - name: Test input engine
        run: sh ./tools/test-input.sh

      - name: Validate TV input contract
        run: sh ./tools/validate-tv-input.sh

      - name: Validate container engine contract
        run: sh ./tools/validate-container.sh

      - name: Test container engine
        run: sh ./tools/test-container.sh

      - name: Validate codec contract
        run: sh ./tools/validate-codec.sh

      - name: Test codec capability probe
        run: sh ./tools/test-codec.sh

      - name: Validate demux contract
        run: sh ./tools/validate-demux.sh

      - name: Test demux parser
        run: sh ./tools/test-demux.sh

      - name: Validate decoder pipeline contract
        run: sh ./tools/validate-decoder.sh

      - name: Test decoder pipeline
        run: sh ./tools/test-decoder.sh

      - name: Validate hardware decoder contract
        run: sh ./tools/validate-hw-decoder.sh

      - name: Test hardware decoder selector
        run: sh ./tools/test-hw-decoder.sh

      - name: Validate audio pipeline contract
        run: sh ./tools/validate-audio-pipeline.sh

      - name: Test audio pipeline
        run: sh ./tools/test-audio-pipeline.sh

      - name: Validate subtitle engine contract
        run: sh ./tools/validate-subtitles.sh

      - name: Test subtitle engine
        run: sh ./tools/test-subtitles.sh

      - name: Validate streaming contract
        run: sh ./tools/validate-streaming.sh

      - name: Test streaming
        run: sh ./tools/test-streaming.sh

      - name: Validate media library contract
        run: sh ./tools/validate-media-library.sh

      - name: Test media library
        run: sh ./tools/test-media-library.sh

      - name: Validate recording engine contract
        run: sh ./tools/validate-recording.sh

      - name: Test recording engine
        run: sh ./tools/test-recording.sh

      - name: Validate tuner integration contract
        run: sh ./tools/validate-tuner.sh

      - name: Test tuner integration
        run: sh ./tools/test-tuner.sh

      - name: Validate broadcast contract
        run: sh ./tools/validate-broadcast.sh

      - name: Test broadcast abstraction
        run: sh ./tools/test-broadcast.sh

      - name: Validate live playback contract
        run: sh ./tools/validate-live.sh

      - name: Test live playback
        run: sh ./tools/test-live.sh

      - name: Validate scan contract
        run: sh ./tools/validate-scan.sh

      - name: Test channel scanning plan
        run: sh ./tools/test-scan.sh

      - name: Validate channel database contract
        run: sh ./tools/validate-channel-db.sh

      - name: Test channel database
        run: sh ./tools/test-channel-db.sh

      - name: Validate EPG contract
        run: sh ./tools/validate-epg.sh

      - name: Test EPG parser
        run: sh ./tools/test-epg.sh

      - name: Validate timeshift contract
        run: sh ./tools/validate-timeshift.sh

      - name: Test timeshift
        run: sh ./tools/test-timeshift.sh

      - name: Validate DVR contract
        run: sh ./tools/validate-dvr.sh

      - name: Test DVR scheduler
        run: sh ./tools/test-dvr.sh

      - name: Validate network TV contract
        run: sh ./tools/validate-network-tv.sh

      - name: Test network TV
        run: sh ./tools/test-network-tv.sh

      - name: Validate casting discovery contract
        run: sh ./tools/validate-cast-discovery.sh

      - name: Test casting discovery
        run: sh ./tools/test-cast-discovery.sh

      - name: Validate media casting contract
        run: sh ./tools/validate-media-cast.sh

      - name: Test media casting
        run: sh ./tools/test-media-cast.sh

      - name: Validate mirror contract
        run: sh ./tools/validate-mirror.sh

      - name: Test screen mirroring ingress
        run: sh ./tools/test-mirror.sh

      - name: Validate WFD contract
        run: sh ./tools/validate-wfd.sh

      - name: Test WFD RTSP negotiation
        run: sh ./tools/test-wfd.sh

      - name: Validate WebRTC contract
        run: sh ./tools/validate-webrtc.sh

      - name: Test WebRTC SDP and ICE
        run: sh ./tools/test-webrtc.sh

      - name: Validate cast session contract
        run: sh ./tools/validate-cast-session.sh

      - name: Test cast session manager
        run: sh ./tools/test-cast-session.sh

      - name: Validate cast device registry contract
        run: sh ./tools/validate-cast-devices.sh

      - name: Test multi-device registry
        run: sh ./tools/test-cast-devices.sh

      - name: Validate Vision frame contract
        run: sh ./tools/validate-vision-frame.sh

      - name: Test Vision frame pipeline
        run: sh ./tools/test-vision-frame.sh

      - name: Validate Vision acceleration contract
        run: sh ./tools/validate-vision-accel.sh

      - name: Test Vision acceleration
        run: sh ./tools/test-vision-accel.sh

      - name: Validate scaler contract
        run: sh ./tools/validate-scaler.sh

      - name: Test scaler
        run: sh ./tools/test-scaler.sh

      - name: Validate super-resolution contract
        run: sh ./tools/validate-superres.sh

      - name: Test super-resolution
        run: sh ./tools/test-superres.sh

      - name: Validate Vision filters contract
        run: sh ./tools/validate-vision-filters.sh

      - name: Test Vision filters
        run: sh ./tools/test-vision-filters.sh

      - name: Validate HDR SDR contract
        run: sh ./tools/validate-hdr.sh

      - name: Test HDR SDR processing
        run: sh ./tools/test-hdr.sh

      - name: Validate frame processing contract
        run: sh ./tools/validate-frame-process.sh

      - name: Test frame processing
        run: sh ./tools/test-frame-process.sh

      - name: Validate adaptive Vision contract
        run: sh ./tools/validate-adaptive.sh

      - name: Test adaptive Vision planner
        run: sh ./tools/test-adaptive.sh

      - name: Validate Android runtime contract
        run: sh ./tools/validate-android-runtime.sh

      - name: Test Android runtime isolation
        run: sh ./tools/test-android-runtime.sh

      - name: Validate Android Binder contract
        run: sh ./tools/validate-android-binder.sh

      - name: Test Android Binder bridge
        run: sh ./tools/test-android-binder.sh

      - name: Validate Android graphics contract
        run: sh ./tools/validate-android-graphics.sh

      - name: Test Android graphics bridge
        run: sh ./tools/test-android-graphics.sh

      - name: Validate Android input contract
        run: sh ./tools/validate-android-input.sh

      - name: Test Android input bridge
        run: sh ./tools/test-android-input.sh

      - name: Validate Android audio contract
        run: sh ./tools/validate-android-audio.sh

      - name: Test Android audio bridge
        run: sh ./tools/test-android-audio.sh

      - name: Validate Android storage contract
        run: sh ./tools/validate-android-storage.sh

      - name: Test Android storage bridge
        run: sh ./tools/test-android-storage.sh

      - name: Validate Android permissions contract
        run: sh ./tools/validate-android-permissions.sh

      - name: Test Android permission bridge
        run: sh ./tools/test-android-permissions.sh

      - name: Validate Android TV contract
        run: sh ./tools/validate-android-tv.sh

      - name: Test Android TV behavior
        run: sh ./tools/test-android-tv.sh

      - name: Validate Android APK package contract
        run: sh ./tools/validate-android-package.sh

      - name: Test Android APK package manager
        run: sh ./tools/test-android-package.sh

      - name: Validate Android capabilities contract
        run: sh ./tools/validate-android-capabilities.sh

      - name: Test Android capability matrix
        run: sh ./tools/test-android-capabilities.sh

      - name: Validate public Sheen API contract
        run: sh ./tools/validate-sheen-api.sh

      - name: Test public Sheen API
        run: sh ./tools/test-sheen-api.sh

      - name: Validate application lifecycle contract
        run: sh ./tools/validate-app-lifecycle.sh

      - name: Test application lifecycle
        run: sh ./tools/test-app-lifecycle.sh

      - name: Validate generic permissions contract
        run: sh ./tools/validate-permissions.sh

      - name: Test generic application permissions
        run: sh ./tools/test-permissions.sh

      - name: Test TV input abstraction
        run: sh ./tools/test-tv-input.sh

      - name: Test hardware discovery
        run: sh ./tools/test-hardware-discovery.sh

  stage1:
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo sh ./scripts/install-deps-debian.sh

      - name: Build Stage 1
        run: sudo sh ./scripts/build.sh x86_64-uefi-usb

      - name: Validate Stage 1 artifacts
        run: sh ./scripts/test.sh x86_64-uefi-usb

      - name: Publish boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheen-x86_64-uefi-usb
          path: out/x86_64-uefi-usb/sheen-x86_64-uefi-usb.img
