name: Sheen OS CI

on:
  push:
  pull_request:

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo sh ./scripts/install-deps-debian.sh

      - name: Validate architecture
        run: sh ./tools/validate-architecture.sh

      - name: Build Stage 1
        run: sudo sh ./scripts/build.sh x86_64-uefi-usb

      - name: Validate Stage 1
        run: sh ./scripts/test.sh x86_64-uefi-usb

      - name: Publish boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheen-x86_64-uefi-usb
          path: out/sheen-x86_64-uefi.img
