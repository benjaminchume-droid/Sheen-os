name: Sheen OS CI

on:
  push:
  pull_request:

jobs:
  stage1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo ./scripts/install-deps-debian.sh

      - name: Build Stage 1
        run: sudo ./scripts/build.sh

      - name: Validate Stage 1
        run: ./scripts/test.sh

      - name: Publish boot artifact
        uses: actions/upload-artifact@v4
        with:
          name: sheen-x86_64-uefi-usb
          path: out/sheen-x86_64-uefi.img
